version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

formats: all

python:
  install:
    # Sphinx/docs dependencies
    - requirements: docs/requirements.txt
    # package and its runtime dependencies (pyproject.toml)
    - method: pip
      path: .
